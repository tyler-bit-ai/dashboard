<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program Hub Mock</title>
<script>try{var t=localStorage.getItem("hub-theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F9;--border:#E2E8F0;--border-strong:#CBD5E1;
  --text:#0F172A;--muted:#475569;--faint:#64748B;
  --accent:#2563EB;--accent-hover:#1D4ED8;--accent-text:#2563EB;--on-accent:#FFFFFF;--accent-soft:#EFF6FF;
  --in:#2563EB;--in-soft:#EFF6FF;--out:#7C3AED;--out-soft:#F5F3FF;--etc:#0F766E;--etc-soft:#F0FDFA;
  --live:#15803D;--live-soft:#F0FDF4;--ver:#B45309;--ver-soft:#FFFBEB;
  --star:#D97706;--shadow:0 1px 2px rgba(15,23,42,.05);--shadow-hover:0 8px 24px rgba(15,23,42,.10);
  --scrim:rgba(15,23,42,.35);--r:12px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B1120;--surface:#111827;--surface-2:#1B2436;--border:#1F2A3D;--border-strong:#334155;
  --text:#E5E7EB;--muted:#A3AEC2;--faint:#8693A8;
  --accent:#2563EB;--accent-hover:#1D4ED8;--accent-text:#93C5FD;--on-accent:#FFFFFF;--accent-soft:#172554;
  --in:#60A5FA;--in-soft:#14233f;--out:#A78BFA;--out-soft:#21183f;--etc:#2DD4BF;--etc-soft:#10272a;
  --live:#4ADE80;--live-soft:#10281a;--ver:#FBBF24;--ver-soft:#2c2108;
  --star:#FBBF24;--shadow:none;--shadow-hover:0 8px 24px rgba(0,0,0,.45);--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Pretendard",system-ui,sans-serif;min-width:320px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-in{max-width:1200px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.mock-tag{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--ver-soft);color:var(--ver);border:1px solid color-mix(in srgb,var(--ver) 30%,transparent)}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:42px;padding:0 44px 0 40px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--faint);border:1px solid var(--border-strong);border-radius:5px;padding:0 6px;background:var(--surface-2)}
.icon-btn{width:42px;height:42px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;transition:background .15s}
.icon-btn:hover{background:var(--surface-2)}
:root[data-theme="dark"] .i-moon,:root:not([data-theme="dark"]) .i-sun{display:none}

main{max-width:1200px;margin:0 auto;padding:28px 20px 72px}
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{margin:0;font-size:28px;letter-spacing:-.03em;line-height:1.25}
.sub{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;min-width:84px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;line-height:1.2;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--faint)}

/* quick access */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.qbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.qhead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.qhead svg{width:16px;height:16px}
.qlist{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 8px;border:1px solid var(--border);border-radius:999px;background:var(--surface-2);text-decoration:none;font-size:14px;font-weight:500;transition:border-color .15s,background .15s;max-width:100%}
.pill:hover{border-color:var(--accent);background:var(--accent-soft)}
.pill span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none}
.dot svg{width:13px;height:13px}
.empty-q{font-size:13px;color:var(--faint)}

/* tabs */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.tabs{display:inline-flex;padding:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;gap:2px;flex-wrap:wrap}
.tab{white-space:nowrap;border:0;background:transparent;height:36px;padding:0 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s}
.tab:hover{color:var(--text)}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.tab small{font-size:12px;font-weight:600;color:var(--faint);background:var(--surface-2);border-radius:999px;padding:0 7px}
.tab[aria-pressed="true"] small{background:var(--accent-soft);color:var(--accent-text)}
.favonly{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-weight:500}
.favonly[aria-pressed="true"]{border-color:var(--star);color:var(--star)}
.favonly[aria-pressed="true"] svg{fill:currentColor}

/* groups + cards */
.group{margin-bottom:32px}
.ghead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.ghead h2{margin:0;font-size:16px;letter-spacing:-.02em}
.ghead .gcount{font-size:13px;color:var(--faint)}
.ghead .dot{width:26px;height:26px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;min-width:0}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--border-strong)}
.card-top{display:flex;align-items:flex-start;gap:12px}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.tile svg{width:20px;height:20px}
.titles{flex:1;min-width:0}
.card h3{margin:0;font-size:16px;line-height:1.35;letter-spacing:-.02em;overflow-wrap:anywhere}
.cat{font-size:12px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{width:36px;height:36px;margin:-6px -6px 0 0;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--faint);transition:color .15s,background .15s}
.star:hover{background:var(--surface-2);color:var(--star)}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] svg{fill:currentColor}
.tag-line{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3.1em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;margin-right:auto}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.live{background:var(--live-soft);color:var(--live)}
.badge.ver{background:var(--ver-soft);color:var(--ver)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--border-strong);background:var(--surface);transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn svg{width:15px;height:15px}
.card .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:0 10px}
.card .btn.ghost:hover{background:var(--surface-2);color:var(--text)}

/* group color helpers */
.g-in{background:var(--in-soft);color:var(--in)}
.g-out{background:var(--out-soft);color:var(--out)}
.g-etc{background:var(--etc-soft);color:var(--etc)}

.none{text-align:center;padding:64px 16px;border:1px dashed var(--border-strong);border-radius:var(--r);color:var(--muted)}
.none b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:41;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);visibility:hidden}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none;visibility:visible}
.d-head{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.d-head h2{margin:0;font-size:20px;letter-spacing:-.02em;line-height:1.3}
.d-body{flex:1;overflow:auto;padding:20px;display:grid;gap:22px;align-content:start}
.d-body h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.d-body p{margin:0;color:var(--muted)}
.d-body code{font:12.5px ui-monospace,Consolas,monospace;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:10px;color:var(--muted);font-size:14px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:700;display:grid;place-items:center}
.hl{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.hl li{display:flex;gap:8px}.hl svg{width:16px;height:16px;margin-top:3px;color:var(--live)}
.d-foot{display:flex;gap:8px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--border);background:var(--surface)}
.d-foot .btn{flex:1;min-width:120px;height:42px}

.foot{margin-top:40px;text-align:center;font-size:12px;color:var(--faint)}

@media (max-width:1024px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){
  .top-in{padding:0 12px;gap:8px;flex-wrap:wrap;height:auto;padding-block:10px}
  .brand .mock-tag{display:none}
  .search{order:3;flex-basis:100%;max-width:none;margin:0}
  .kbd{display:none}
  .brand{margin-right:auto}
  main{padding:20px 14px 56px}
  h1{font-size:23px}
  .quick{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .tabs{width:100%;flex-wrap:nowrap}.tab{flex:1;justify-content:center;padding:0 6px;gap:5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
    Program Hub <span class="mock-tag">MOCK</span>
  </div>
  <label class="search">
    <span class="sr">프로그램 검색</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="프로그램, 태그 검색" autocomplete="off">
    <span class="kbd" aria-hidden="true">/</span>
  </label>
  <button class="icon-btn" id="theme" type="button" aria-label="테마 전환">
    <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</div></header>

<main>
  <section class="intro">
    <div>
      <h1>사내 프로그램 허브</h1>
      <p class="sub">원하는 도구를 검색해서 바로 열어보세요.</p>
    </div>
    <div class="stats" id="stats" aria-label="요약"></div>
  </section>

  <section class="quick" aria-label="빠른 접근">
    <div class="qbox"><div class="qhead"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>즐겨찾기</div><div class="qlist" id="favs"></div></div>
    <div class="qbox"><div class="qhead"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>최근 사용</div><div class="qlist" id="recent"></div></div>
  </section>

  <div class="bar">
    <div class="tabs" id="tabs" role="group" aria-label="그룹 필터"></div>
    <button class="favonly" id="favonly" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>즐겨찾기만</button>
  </div>

  <div id="list" aria-live="polite"></div>
  <p class="foot">디자인 컨펌용 목업입니다. 즐겨찾기와 최근 사용은 이 브라우저에만 저장됩니다.</p>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" tabindex="-1"></aside>

  const q=state.q.trim().toLowerCase();
  if(!q)return true;
  return [p.name,p.repo,p.tagline,p.cat,p.tags.join(" ")].join(" ").toLowerCase().includes(q);
}

function card(p){
  const fav=state.favs.includes(p.id);
  const open=p.mode==="app"
    ? `<a class="btn primary" href="${esc(p.url)}" target="_blank" rel="noreferrer" data-open="${p.id}" aria-label="${esc(p.name)} 열기">열기 ${EXT}</a>`
    : `<a class="btn primary" href="${esc(p.readme||p.url)}" target="_blank" rel="noreferrer" data-open="${p.id}" aria-label="${esc(p.name)} README 보기">README ${DOC}</a>`;
  return `<article class="card">
    <div class="card-top">
      <span class="tile ${G[p.group].cls}"><svg viewBox="0 0 24 24">${G[p.group].icon}</svg></span>
      <div class="titles"><h3>${esc(p.name)}</h3><div class="cat">${esc(p.cat)}</div></div>
      <button class="star" type="button" data-fav="${p.id}" aria-pressed="${fav}" aria-label="${esc(p.name)} 즐겨찾기">${STAR}</button>
    </div>
    <p class="tag-line">${esc(p.tagline)}</p>
    <div class="chips">${p.tags.slice(0,3).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
    <div class="card-foot">
      <span class="badge ${isLive(p)?"live":"ver"}">${esc(p.status)}</span>
      <button class="btn ghost" type="button" data-detail="${p.id}" aria-label="${esc(p.name)} 상세 보기">상세</button>
      ${open}
    </div>
  </article>`;
}

function renderList(){
  const items=DATA.filter(match);
  if(!items.length){
    $("#list").innerHTML=`<div class="none"><b>검색 결과가 없습니다</b>다른 검색어를 입력하거나 필터를 해제해 보세요.</div>`;
    return;
  }
  const groups=state.group==="all"?ORDER:[state.group];
  $("#list").innerHTML=groups.map(g=>{
    const gi=items.filter(p=>p.group===g);
    if(!gi.length)return"";
    return `<section class="group" aria-label="${g}"><div class="ghead">${tile({group:g},26)}<h2>${G[g].label}</h2><span class="gcount">${gi.length}개</span></div><div class="grid">${gi.map(card).join("")}</div></section>`;
  }).join("");
}

function renderTabs(){
  const mk=(k,l,n)=>`<button class="tab" type="button" data-group="${k}" aria-pressed="${state.group===k}">${l}<small>${n}</small></button>`;
  $("#tabs").innerHTML=mk("all","전체",DATA.length)+ORDER.map(g=>mk(g,G[g].label,DATA.filter(p=>p.group===g).length)).join("");
  $("#favonly").setAttribute("aria-pressed",state.favOnly);
}

function renderStats(){
  const s=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  $("#stats").innerHTML=s(DATA.length,"전체 프로그램")+s(DATA.filter(isLive).length,"Live")+s(DATA.filter(p=>p.mode==="app").length,"웹 앱");
}

function renderQuick(){
  const pill=p=>`<a class="pill" href="${esc(p.mode==="app"?p.url:(p.readme||p.url))}" target="_blank" rel="noreferrer" data-open="${p.id}">${tile(p)}<span>${esc(p.name)}</span></a>`;
  const fill=(el,ids,msg)=>{const ps=ids.map(byId).filter(Boolean);$(el).innerHTML=ps.length?ps.map(pill).join(""):`<span class="empty-q">${msg}</span>`};
  fill("#favs",state.favs,"카드의 별을 눌러 자주 쓰는 도구를 고정하세요.");
  fill("#recent",state.recent.slice(0,5),"아직 연 프로그램이 없습니다.");
}

function renderAll(){renderStats();renderTabs();renderQuick();renderList()}

function toggleFav(id){
  state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[id,...state.favs];
  store.set("hub-favs",state.favs);renderQuick();renderList();
  if(document.body.classList.contains("open"))renderDrawer(drawerId);
}
function markRecent(id){
  state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,8);
  store.set("hub-recent",state.recent);renderQuick();
}

let drawerId=null;
function renderDrawer(id){
  const p=byId(id);if(!p)return;drawerId=id;
  const fav=state.favs.includes(id);
  const primary=p.mode==="app"
    ? `<a class="btn primary" href="${esc(p.url)}" target="_blank" rel="noreferrer" data-open="${p.id}">${esc(p.primaryLabel||"Open App")} ${EXT}</a>`
    : `<a class="btn primary" href="${esc(p.readme||p.url)}" target="_blank" rel="noreferrer" data-open="${p.id}">README 보기 ${DOC}</a>`;
  const repoBtn=p.repoUrl&&p.repoUrl!==p.url?`<a class="btn" href="${esc(p.repoUrl)}" target="_blank" rel="noreferrer">저장소 ${EXT}</a>`:"";
  $("#drawer").innerHTML=`
    <div class="d-head">
      <span class="tile ${G[p.group].cls}"><svg viewBox="0 0 24 24">${G[p.group].icon}</svg></span>
      <div class="titles"><h2 id="d-title">${esc(p.name)}</h2><div class="cat">${esc(p.group)} · ${esc(p.cat)} · <span class="badge ${isLive(p)?"live":"ver"}" style="margin:0">${esc(p.status)}</span></div></div>
      <button class="star" type="button" data-fav="${p.id}" aria-pressed="${fav}" aria-label="즐겨찾기">${STAR}</button>
      <button class="star" type="button" id="d-close" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="d-body">
      <section><h4>소개</h4><p>${md(p.summary)}</p></section>
      <section><h4>접근 방법</h4><p>${esc(p.note)}</p></section>
      <section><h4>사용 순서</h4><ol class="steps">${p.usage.map(u=>`<li><span>${md(u)}</span></li>`).join("")}</ol></section>
      <section><h4>주요 기능</h4><ul class="hl">${p.highlights.map(h=>`<li>${CHECK}<span>${esc(h)}</span></li>`).join("")}</ul></section>
      <section><h4>태그</h4><div class="chips">${p.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></section>
    </div>
    <div class="d-foot">${primary}${repoBtn}</div>`;
}
function openDrawer(id,trigger){
  state.lastFocus=trigger||document.activeElement;
  renderDrawer(id);document.body.classList.add("open");
  $("#d-close").focus();
}
function closeDrawer(){
  document.body.classList.remove("open");
  if(state.lastFocus&&document.contains(state.lastFocus))state.lastFocus.focus();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-group],[data-fav],[data-detail],[data-open],#d-close,#scrim,#favonly,#theme");
  if(!t)return;
  if(t.dataset.group){state.group=t.dataset.group;renderTabs();renderList()}
  else if(t.dataset.fav)toggleFav(t.dataset.fav);
  else if(t.dataset.detail)openDrawer(t.dataset.detail,t);
  else if(t.dataset.open)markRecent(t.dataset.open);
  else if(t.id==="d-close"||t.id==="scrim")closeDrawer();
  else if(t.id==="favonly"){state.favOnly=!state.favOnly;renderTabs();renderList()}
  else if(t.id==="theme"){
    const n=document.documentElement.dataset.theme==="dark"?"light":"dark";
    document.documentElement.dataset.theme=n;try{localStorage.setItem("hub-theme",n)}catch(e){}
  }
});
$("#q").addEventListener("input",e=>{state.q=e.target.value;renderList()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&document.body.classList.contains("open"))closeDrawer();
  else if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}
  else if(e.key==="Tab"&&document.body.classList.contains("open")){
    const f=[...$("#drawer").querySelectorAll("button,a[href]")];
    if(!f.length)return;
    const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  }
});
renderAll();
</script>
</body>
</html>
